function inject() {
  var url = document.getElementById('url').value;
  var status = document.getElementById('status');
  status.textContent = '正在打开 ' + url + '...';

  // Open UTools in a new window
  var win = window.open(url, '_blank');
  if (!win) {
    status.textContent = '❌ 弹窗被阻止，请允许弹窗后重试';
    return;
  }

  status.textContent = '⏳ 等待页面加载...';

  // Wait for the page to load, then inject the plugin
  var checkInterval = setInterval(function() {
    try {
      if (win.document.readyState === 'complete') {
        clearInterval(checkInterval);
        // Inject the plugin code
        var script = win.document.createElement('script');
        script.textContent = PLUGIN_CODE;
        win.document.head.appendChild(script);
        status.textContent = '✅ 插件注入成功！';
      }
    } catch(e) {
      // Cross-origin error, try again
    }
  }, 500);

  // Timeout after 30 seconds
  setTimeout(function() {
    clearInterval(checkInterval);
    status.textContent = '⚠️ 注入超时，请手动刷新页面';
  }, 30000);
}
</script>
</body>
</html>
